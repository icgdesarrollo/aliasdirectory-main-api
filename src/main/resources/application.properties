spring.application.name=api-principal

# Los valores reales se inyectan por variables de entorno (ConfigMap y Secret en k8s);
# los defaults son solo para desarrollo local.
server.port=${MAIN_API_PORT:${SERVER_PORT:8080}}

# Sondas de Kubernetes: /actuator/health/liveness y /actuator/health/readiness.
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health

# Base de datos. Dos cuentas segregadas (E03-D01):
#  - la aplicacion entra como alias_directory_app (DML, sin DDL, sin DELETE, sin crypto_key);
#  - Flyway migra como alias_directory_migrator. Sin spring.flyway.user Boot usaria el DataSource
#    de la aplicacion y las migraciones fallarian por falta de DDL.
# En local estos valores los fija application-local.yml (perfil `local`).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/alias_directory}
spring.datasource.username=${DB_APP_USER:alias_directory_app}
# Sin valor por omision a proposito: una contrasena vacia por defecto convierte un
# despliegue sin Secret en un 'Access denied ... (using password: NO)', que parece un
# problema de credenciales del servidor y en realidad es una variable sin definir.
spring.datasource.password=${DB_APP_PASSWORD}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${DB_MIGRATOR_USER:alias_directory_migrator}
spring.flyway.password=${DB_MIGRATOR_PASSWORD}
# No hay JPA en el classpath. Si se agrega, ddl-auto debe ser none: el esquema lo manda Flyway.

# --- RabbitMQ -----------------------------------------------------------------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5671}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

# --- AMQPS con mTLS (E05-D03) -------------------------------------------------
# El broker exige certificado de cliente (fail_if_no_peer_cert), asi que sin estos
# keystores la conexion se rechaza en el apreton de manos, antes de que el usuario
# y la contrasena entren en juego.
#
# Los archivos los genera aliasdirectory-infra/scripts/generar-certificados.sh y no
# se versionan. Viven en el repositorio de infraestructura, que desde aca es una
# carpeta hermana: por eso la ruta por omision sube un nivel y vuelve a bajar.
# spring-boot:run trabaja desde el directorio del modulo, no desde la carpeta que
# contiene los repositorios, asi que ../aliasdirectory-infra/ es relativo a el.
# Si los repositorios no estan clonados uno al lado del otro, las variables
# RABBITMQ_KEYSTORE y RABBITMQ_TRUSTSTORE del .env mandan sobre esta ruta.
# En k8s llegan montados desde un Secret que inyecta el KMS, y la clave del
# keystore sale de ahi tambien: por eso KEYSTORE_PASS no tiene valor por omision
# para produccion, solo el de desarrollo que trae el script.
spring.rabbitmq.ssl.enabled=true
spring.rabbitmq.ssl.key-store=file:${RABBITMQ_KEYSTORE:../aliasdirectory-infra/certificados/api-principal.p12}
spring.rabbitmq.ssl.key-store-password=${RABBITMQ_KEYSTORE_PASS:directorio-alias-dev}
spring.rabbitmq.ssl.key-store-type=PKCS12
spring.rabbitmq.ssl.trust-store=file:${RABBITMQ_TRUSTSTORE:../aliasdirectory-infra/certificados/truststore.p12}
spring.rabbitmq.ssl.trust-store-password=${RABBITMQ_TRUSTSTORE_PASS:directorio-alias-dev}
spring.rabbitmq.ssl.trust-store-type=PKCS12
# Sin esto el cliente de RabbitMQ acepta CUALQUIER certificado de servidor: la
# validacion del certificado y la del nombre de host estan apagadas por omision en
# amqp-client, y un canal cifrado contra un servidor que no verificamos es
# exactamente lo que un intermediario necesita.
spring.rabbitmq.ssl.validate-server-certificate=true
spring.rabbitmq.ssl.verify-hostname=true
spring.rabbitmq.ssl.algorithm=TLSv1.3

# Las 20 colas que escucha el consumidor. Son las mismas de
# participant_bank.amqps_queue; cuando el consumidor lea el padron de la base,
# esta lista se arma de ahi y esta propiedad desaparece.
icg.consumer.queues=${CONSUMIDOR_COLAS:alias.requests.agrogtgc,alias.requests.amcngtgt,alias.requests.antggtg1,alias.requests.aztkgtgc,alias.requests.bagugtgc,alias.requests.binmgtgc,alias.requests.bprcgtgc,alias.requests.brrlgtgc,alias.requests.cdsogtg2,alias.requests.chnagtgc,alias.requests.dibigtgc,alias.requests.fcohgtgc,alias.requests.fivngtg1,alias.requests.fnmvgtg2,alias.requests.fscggtg1,alias.requests.gtcogtgc,alias.requests.indlgtgc,alias.requests.nsoagtgt,alias.requests.trajgtgc,alias.requests.vivbgtgt}

# Cuantos mensajes procesa a la vez cada cola. Uno por ahora: el esqueleto no
# hace trabajo real y subirlo solo escondria problemas de concurrencia que
# todavia no se pueden probar.
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.prefetch=1

# --- Directorio ---------------------------------------------------------------
# BIC del propio directorio: es el Assgnr de toda respuesta.
icg.directory.bic=${DIRECTORIO_BIC:ICGSGTGC}

# Llave del índice ciego (HMAC-SHA256, base64, 32 bytes o más). Sin valor por
# omisión a propósito: un defecto haría que dos ambientes calcularan el mismo
# HMAC sin que nadie lo decidiera, y el índice ciego deja de proteger nada si su
# llave es pública.
# Sólo se usa cuando icg.kms.enabled=false; con el KMS encendido, esta llave
# no existe fuera de OpenBao y esta propiedad se ignora.
icg.blind-index.key=${BLIND_INDEX_KEY}

# --- KMS · OpenBao Transit (E03-D03 / E05-D06) --------------------------------
# Con habilitado=true el indice ciego se calcula DENTRO del KMS y la aplicacion
# deja de tener material de llave. Con false usa LocalHmacBlindIndex, que tiene
# la llave en configuracion y no es apto para produccion.
#
# Apagado por omision a proposito: una compilacion recien clonada tiene que poder
# arrancar sin levantar un KMS, igual que las pruebas que no lo necesitan.
icg.kms.enabled=${KMS_HABILITADO:false}
icg.kms.url=${KMS_URL:http://localhost:8200}
# Sin valor por omision: un token de desarrollo que se cuele como defecto en un
# despliegue real es peor que un arranque fallido con el nombre de la variable.
# Como el bean del KMS es condicional, esta propiedad solo se resuelve cuando
# icg.kms.enabled=true; con el KMS apagado no estorba.
icg.kms.token=${KMS_TOKEN}
icg.kms.encryption-key=${KMS_LLAVE_CIFRADO:dir-alias-pii}
icg.kms.index-key=${KMS_LLAVE_INDICE:dir-alias-bidx}
# Tercera llave, para el sello de integridad (H-57). Separada de las otras dos:
# quien pueda sellar filas no debe poder descifrarlas ni calcular indices ciegos.
icg.kms.integrity-key=${KMS_LLAVE_INTEGRIDAD:dir-alias-integridad}

# --- Portal de Call Center · BFF (E15) ----------------------------------------
# El BFF valida el JWT que emite Keycloak contra el emisor del reino. Spring
# descubre las llaves publicas en {issuer-uri}/.well-known/openid-configuration,
# asi que no hay secreto que custodiar de este lado.
#
# Sin valor por omision a proposito: un emisor por defecto haria que un despliegue
# sin configurar aceptara tokens de otro reino, y un token de otro reino es un
# usuario que este directorio nunca dio de alta.
# Apagado por omision, igual que el KMS: una compilacion recien clonada tiene que
# poder arrancar sin levantar un Keycloak, y quien solo trabaja en el consumidor de
# colas no necesita un IdP. Con false los endpoints /portal/** no existen; no es que
# queden abiertos, es que no se publican.
icg.portal.enabled=${PORTAL_HABILITADO:false}
# Vacio por omision para que la propiedad resuelva con el portal apagado. Con
# icg.portal.enabled=true y este valor vacio, el arranque falla al configurar el
# resource server, que es lo correcto: un portal sin emisor no valida nada.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:}
# La audiencia que el reino pone en el token (mapper audience-bff). Se valida
# ademas del emisor: un token emitido para otra aplicacion del mismo reino no
# sirve aqui. Es el propio cliente del portal: no hace falta un cliente aparte
# solo para nombrar la audiencia.
spring.security.oauth2.resourceserver.jwt.audiences=${OIDC_AUDIENCE:dca-portal-cc}

# Origenes del navegador que pueden llamar al BFF. Lista separada por comas: el
# portal y el BFF viven en puertos distintos, asi que sin esto el navegador
# bloquea toda llamada en el preflight.
icg.portal.cors-origins=${PORTAL_CORS_ORIGINS:http://localhost:5173}

# Cuanto vive una solicitud de baja sin aprobar antes de vencer (Anexo 8.2).
icg.portal.solicitud-baja-ttl-horas=${PORTAL_BAJA_TTL_HORAS:72}
